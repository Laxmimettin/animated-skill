<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Skill Bars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="skills-section" id="skills">
        <p class="subtitle">WHAT I DO</p>
        <h1>My Technical Skills</h1>
        <p class="description">
            My skills and proficiency in web development and programming.
        </p>

        <div class="skills-container">

            <div class="skill">
                <div class="skill-info">
                    <span>HTML5</span>
                    <span class="percentage">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar html" data-progress="95"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>CSS3</span>
                    <span class="percentage">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar css" data-progress="90"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>JavaScript</span>
                    <span class="percentage">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar javascript" data-progress="85"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>React.js</span>
                    <span class="percentage">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar react" data-progress="80"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>Node.js</span>
                    <span class="percentage">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar node" data-progress="75"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>MongoDB</span>
                    <span class="percentage">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar mongo" data-progress="70"></div>
                </div>
            </div>

        </div>

        <button id="replay-btn">Replay Animation ↻</button>
    </main>

</body>

</html>
